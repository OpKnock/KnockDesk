name: One-time commit attribution cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/commit-attribution-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knockdesk-commit-attribution-cleanup
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'OpKnock/KnockDesk'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: python -m pip install --upgrade git-filter-repo

      - name: Normalize commit attribution to the project owner
        shell: bash
        run: |
          set -euo pipefail

          remote_tip="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after this workflow started; refusing to overwrite newer commits."
            exit 1
          fi

          git checkout -B main "$GITHUB_SHA"

          # Build the account-linked private email without storing a literal email address in source.
          gh_email="$(python -c 'print("287473583+OpKnock" + chr(64) + "users.noreply.github.com")')"

          git filter-repo --force \
            --name-callback 'return b"OpKnock"' \
            --email-callback 'return b"287473583+OpKnock" + bytes([64]) + b"users.noreply.github.com"'

          if git log --all --format='%an <%ae>%n%cn <%ce>' | grep -vF "OpKnock <$gh_email>"; then
            echo '::error::Commit attribution validation failed; refusing to publish.'
            exit 1
          fi

          if [[ ! -f .github/workflows/commit-attribution-cleanup.yml ]]; then
            echo '::error::Temporary workflow file is missing; refusing to publish.'
            exit 1
          fi

          git rm .github/workflows/commit-attribution-cleanup.yml
          git config user.name 'OpKnock'
          git config user.email "$gh_email"
          git commit -m 'chore: finalize commit attribution cleanup'

          if git log --all --format='%an <%ae>%n%cn <%ce>' | grep -vF "OpKnock <$gh_email>"; then
            echo '::error::Final history still has inconsistent attribution; refusing to publish.'
            exit 1
          fi

          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/main:"$GITHUB_SHA" origin refs/heads/main:refs/heads/main
          git push --force origin --tags
