name: KnockDesk CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Source tests and renderer build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sources without downloading packaged LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resources/hermes-runtime/src/package-lock.json

      - name: Test build script and source wiring
        run: node --test scripts/build-pipeline.test.mjs

      - name: Install locked workspaces
        working-directory: resources/hermes-runtime/src
        run: npm ci --workspace electron --workspace web --include-workspace-root=false --no-audit

      - name: Type-check web and desktop renderer
        working-directory: resources/hermes-runtime/src/web
        run: npm run typecheck

      - name: Test web dashboard
        working-directory: resources/hermes-runtime/src/web
        run: npm test

      - name: Lint new KnockDesk desktop renderer
        working-directory: resources/hermes-runtime/src/web
        run: npx eslint src/desktop

      - name: Report legacy Hermes dashboard lint debt (advisory)
        working-directory: resources/hermes-runtime/src/web
        continue-on-error: true
        run: npm run lint

      - name: Build Hermes dashboard
        working-directory: resources/hermes-runtime/src
        run: npm run build --workspace web

      - name: Build source-owned KnockDesk renderer and Electron shell
        run: node build-electron-main.mjs --skip-install

      - name: Secret scan first-party sources
        run: python scripts/secret-scan.py

  python-quality:
    name: Python syntax and first-party security tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile maintained Python sources
        run: python -m compileall -q resources/knockdesk-computer resources/hermes-plugins scripts

      - name: Test privacy and archive maintenance utilities
        run: python -m unittest discover -s scripts -p "test_maintenance_tools.py" -v

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff

      - name: Lint the repository secret scanner
        run: ruff check scripts/secret-scan.py

      - name: Format the repository secret scanner
        run: ruff format --check scripts/secret-scan.py
      - name: Lint the repository privacy scanner
        run: ruff check scripts/privacy-scan.py

      - name: Format the repository privacy scanner
        run: ruff format --check scripts/privacy-scan.py

      - name: Scan first-party files for accidental personal data
        run: python scripts/privacy-scan.py

  source-desktop-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows desktop renderer smoke test
          - os: macos-latest
            name: macOS desktop renderer smoke test
    needs: [source-build]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resources/hermes-runtime/src/package-lock.json

      - name: Install Electron and renderer workspaces
        working-directory: resources/hermes-runtime/src
        run: |
          npm ci --workspace electron --workspace web --include-workspace-root=false --no-audit
          npm exec --workspace electron -- install-electron --no

      - name: Compile Electron main and build the desktop renderer
        working-directory: resources/hermes-runtime/src
        run: |
          npm run compile --workspace electron
          npm run build:desktop --workspace web

      - name: Setup Python and install Playwright
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependency
        run: python -m pip install --disable-pip-version-check playwright

      - name: Launch Electron and verify desktop UI
        run: python scripts/source_desktop_smoke_test.py

  asar-integrity:
    name: Existing packaged artifact integrity
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify packaged ASAR can be listed
        shell: bash
        run: |
          npx --yes asar list resources/app.asar > /dev/null
          echo "ASAR archive listing succeeded"

      - name: Check KnockDesk branding in archive header
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const data = fs.readFileSync('resources/app.asar');
            const header = data.toString('utf8', 0, Math.min(data.length, 1000000));
            const stonic = header.match(/Stonic AI/gi)?.length || 0;
            const knockdesk = header.match(/KnockDesk/gi)?.length || 0;
            console.log('Legacy brand hits:', stonic);
            console.log('KnockDesk brand hits:', knockdesk);
            if (stonic > 0 || knockdesk === 0) process.exit(1);
          "

      - name: Verify packaged executable and archive are real LFS payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("KnockDesk.exe", "resources/app.asar", "resources/main.jsc"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing required artifact: {name}")
              prefix = path.read_bytes()[:80]
              if prefix.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  raise SystemExit(f"LFS pointer was checked out instead of payload: {name}")
              print(f"Verified payload: {name} ({path.stat().st_size:,} bytes)")
          PY

  lfs-pointer-check:
    name: Git LFS pointer and attribute integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Verify tracked LFS objects are represented by pointers
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          names = subprocess.check_output(
              ["git", "lfs", "ls-files", "--name-only"], text=True
          ).splitlines()
          if not names:
              raise SystemExit("No LFS-tracked files were found")
          bad = []
          for name in names:
              path = Path(name)
              if not path.is_file():
                  bad.append(f"missing: {name}")
                  continue
              if not path.read_bytes().startswith(b"version https://git-lfs.github.com/spec/v1"):
                  bad.append(f"not a pointer: {name}")
          if bad:
              print("\\n".join(bad))
              raise SystemExit(f"{len(bad)} LFS pointer checks failed")
          print(f"Verified {len(names)} Git LFS pointer files")
          PY

      - name: Check binary patterns are tracked by Git LFS
        run: |
          node -e "
            const fs = require('fs');
            const attr = fs.readFileSync('.gitattributes', 'utf8');
            for (const pattern of ['*.exe', '*.dll', '*.pak', '*.bin', '*.dat', '*.asar', '*.jsc']) {
              if (!attr.split(/\\r?\\n/).some(line => line.trim().startsWith(pattern + ' '))) {
                console.error('Missing .gitattributes rule:', pattern);
                process.exit(1);
              }
            }
            console.log('Required binary patterns have Git LFS rules');
          "

  smoke-test:
    name: Packaged app smoke test
    runs-on: windows-latest
    timeout-minutes: 15
    if: vars.ENABLE_PACKAGED_SMOKE_TEST == 'true'
    needs: [asar-integrity, source-build]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright psutil aiohttp
          python -m playwright install chromium

      - name: Run packaged app smoke test
        run: python scripts/smoke_test.py --timeout 90

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r resources/knockdesk-computer/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resources/hermes-runtime/src/package-lock.json

      - name: Audit Node workspace dependencies
        working-directory: resources/hermes-runtime/src
        run: |
          npm ci --workspace electron --workspace web --include-workspace-root=false --no-audit
          npm audit --workspace electron --workspace web --audit-level=low

  # Packaged release publishing remains explicitly opt-in until the maintained
  # source-owned renderer and Windows runtime have passed the desktop smoke test.
  legacy-release-package:
    name: Legacy packaged release (explicit opt-in)
    runs-on: windows-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v') && vars.ALLOW_LEGACY_BINARY_RELEASE == 'true'
    permissions:
      contents: write
    needs: [source-build, python-quality, asar-integrity, lfs-pointer-check]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Generate inventory
        run: python scripts/inventory.py

      - name: Create portable archive
        shell: bash
        run: |
          7z a -tzip "KnockDesk-${{ github.ref_name }}-windows.zip" \
            KnockDesk.exe resources/ locales/ scripts/ \
            LICENSE.electron.txt LICENSES.chromium.html README.md \
            .gitattributes .gitignore .knockdesk-staged.json \
            -xr!.git -xr!__pycache__ -xr!*.log -xr!*.tmp

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "KnockDesk-${{ github.ref_name }}-windows.zip"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
