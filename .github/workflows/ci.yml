name: KnockDesk CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Ensure consistent line endings for LFS
  GIT_LFS_SKIP_SMUDGE: 0

jobs:
  # 1. Quick lint / type checks (fast, no heavy deps)
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            resources/knockdesk-computer/requirements.txt

      - name: Install Python deps
        run: |
          pip install -q ruff mypy playwright
          playwright install --with-deps chromium 2>&1 | tail -5

      - name: Ruff (Python lint/format)
        run: |
          ruff check resources/knockdesk-computer/ resources/hermes-plugins/ scripts/
          ruff format --check resources/knockdesk-computer/ resources/hermes-plugins/ scripts/

      - name: MyPy (type check Python)
        run: |
          mypy --strict resources/knockdesk-computer/ resources/hermes-plugins/knockdesk/ resources/hermes-plugins/knockdesk-computer/ resources/hermes-plugins/knockdesk-memory/ 2>&1 | head -50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resources/hermes-runtime/src/web/package.json

      - name: Install web deps
        working-directory: resources/hermes-runtime/src/web
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript type check
        working-directory: resources/hermes-runtime/src/web
        run: npx tsc --noEmit 2>&1 | head -50

      - name: ESLint
        working-directory: resources/hermes-runtime/src/web
        run: npx eslint src --ext .ts,.tsx 2>&1 | head -50

      - name: Stylelint
        working-directory: resources/hermes-runtime/src/web
        run: npx stylelint "src/**/*.css" 2>&1 | head -50

  # 2. ASAR integrity & brand check
  asar-integrity:
    name: ASAR Integrity & Brand
    runs-on: windows-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify app.asar exists and readable
        run: |
          npx --yes asar list resources/app.asar > /dev/null
          echo "app.asar listing OK"

      - name: Check brand strings in app.asar
        run: |
          node -e "
            const fs = require('fs');
            const data = fs.readFileSync('resources/app.asar');
            const stonic = data.toString('utf8', 0, 1000000).match(/Stonic AI/gi)?.length || 0;
            const knockdesk = data.toString('utf8', 0, 1000000).match(/KnockDesk/gi)?.length || 0;
            console.log('Stonic AI hits:', stonic);
            console.log('KnockDesk hits:', knockdesk);
            if (stonic > 0) process.exit(1);
          "

      - name: Verify logo assets in app.asar
        run: |
          npx --yes asar extract-file resources/app.asar dist/logo.png /tmp/logo.png
          node -e "
            const fs = require('fs');
            const stat = fs.statSync('/tmp/logo.png');
            console.log('logo.png size:', stat.size, 'bytes');
            if (stat.size < 1000) process.exit(1);
          "

  # 3. LFS pointer verification
  lfs-check:
    name: Git LFS Pointers
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LFS files are pointers (not actual binaries)
        run: |
          git lfs ls-files | while read -r sha name; do
            if [ -f "$name" ]; then
              head -c 100 "$name" | grep -q "version https://git-lfs.github.com/spec/v1" || {
                echo "ERROR: $name is not an LFS pointer (actual binary committed)"
                exit 1
              }
            fi
          done
          echo "All tracked files are proper LFS pointers"

      - name: Check .gitattributes coverage
        run: |
          node -e "
            const fs = require('fs');
            const attr = fs.readFileSync('.gitattributes', 'utf8');
            const patterns = ['*.exe', '*.dll', '*.pak', '*.bin', '*.dat', '*.asar', '*.jsc'];
            for (const p of patterns) {
              if (!attr.includes(p)) {
                console.error('Missing in .gitattributes:', p);
                process.exit(1);
              }
            }
            console.log('.gitattributes covers all binary patterns');
          "

  # 4. Smoke test (requires Windows GUI - runs on self-hosted or manual)
  smoke-test:
    name: Smoke Test (manual/self-hosted)
    runs-on: windows-latest
    timeout-minutes: 10
    if: false  # Set to true when self-hosted runner with GPU is available
    needs: [lint-and-typecheck, asar-integrity]
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install smoke test deps
        run: |
          pip install -q playwright psutil aiohttp
          playwright install --with-deps chromium

      - name: Run smoke test
        run: |
          python scripts/smoke_test.py --timeout 90

  # 5. Release packaging (tagged releases only)
  release-package:
    name: Package Release
    runs-on: windows-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-and-typecheck, asar-integrity, lfs-check]
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate inventory
        run: |
          python scripts/inventory.py
          cat docs/INVENTORY.md | head -20

      - name: Create release archive (portable zip)
        run: |
          7z a -tzip "KnockDesk-${{ github.ref_name }}-windows.zip" \
            KnockDesk.exe \
            resources/ \
            locales/ \
            scripts/ \
            *.pak *.dll *.bin *.dat *.pak *.jsc \
            LICENSE.electron.txt \
            LICENSES.chromium.html \
            README.md \
            .gitattributes \
            .gitignore \
            .knockdesk-staged.json \
            -xr!.git -xr!__pycache__ -xr!*.log -xr!*.tmp
          echo "Archive created"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "KnockDesk-${{ github.ref_name }}-windows.zip"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 6. Dependency audit
  audit:
    name: Dependency Audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Python audit
        run: |
          pip install -q pip-audit
          pip-audit -r resources/knockdesk-computer/requirements.txt -r requirements.txt || true

      - name: Node audit
        working-directory: resources/hermes-runtime/src/web
        run: |
          npm audit --audit-level=high || true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true