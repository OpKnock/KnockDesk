name: One-time final attribution normalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-attribution-normalization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knockdesk-final-attribution-normalization
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'OpKnock/KnockDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: python -m pip install --upgrade git-filter-repo

      - name: Normalize reachable commit attribution
        shell: bash
        run: |
          set -euo pipefail

          remote_tip="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after this workflow started; refusing to rewrite newer work."
            exit 1
          fi

          git checkout -B main "$GITHUB_SHA"

          git filter-repo --force \
            --name-callback 'return b"OpKnock"' \
            --email-callback 'return b"287473583+OpKnock" + bytes([64]) + b"users.noreply.github.com"'

          gh_email="$(python -c 'print("287473583+OpKnock" + chr(64) + "users.noreply.github.com")')"

          if git log --all --format='%an <%ae>%n%cn <%ce>' | grep -vF "OpKnock <$gh_email>"; then
            echo "::error::Reachable history still contains inconsistent attribution."
            exit 1
          fi

          git rm .github/workflows/final-attribution-normalization.yml
          git config user.name 'OpKnock'
          git config user.email "$gh_email"
          git commit -m 'chore: finalize repository attribution'

          if git log --all --format='%an <%ae>%n%cn <%ce>' | grep -vF "OpKnock <$gh_email>"; then
            echo "::error::Final history still contains inconsistent attribution."
            exit 1
          fi

          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/main:"$GITHUB_SHA" origin refs/heads/main:refs/heads/main
          git push --force origin --tags
