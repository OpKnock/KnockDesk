name: One-time commit identity cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/identity-history-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knockdesk-history-identity-cleanup
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.repository == 'OpKnock/KnockDesk'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: python -m pip install --upgrade git-filter-repo

      - name: Rewrite the personal identity in commit metadata
        shell: bash
        run: |
          set -euo pipefail

          # Refuse to proceed if main advanced after this workflow was triggered.
          remote_tip="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after this workflow was triggered; refusing to overwrite newer commits."
            exit 1
          fi

          git checkout -B main "$GITHUB_SHA"
          echo "Original main tip: $(git rev-parse HEAD)"

          if ! git log --all --format='%an <%ae>%n%cn <%ce>' | grep -Fq 'yoinkingfish@gmail.com'; then
            echo '::error::Expected personal email was not found; refusing to rewrite history.'
            exit 1
          fi

          git filter-repo --force \
            --name-callback 'return b"KnockDesk Maintainers" if name == b"Mehul Wagde" else name' \
            --email-callback 'return b"opensource@knockdesk.invalid" if email == b"yoinkingfish@gmail.com" else email'

          if git log --all --format='%an <%ae>%n%cn <%ce>' | grep -E 'Mehul Wagde|yoinkingfish@gmail\.com'; then
            echo '::error::Personal identity remains in reachable commit metadata after rewrite.'
            exit 1
          fi

          if [[ ! -f .github/workflows/identity-history-cleanup.yml ]]; then
            echo '::error::Expected temporary workflow file is missing; refusing to publish.'
            exit 1
          fi

          # Remove this temporary workflow before publishing the rewritten history.
          git rm .github/workflows/identity-history-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time history maintenance workflow'

          if git log --all --format='%an <%ae>%n%cn <%ce>' | grep -E 'Mehul Wagde|yoinkingfish@gmail\.com'; then
            echo '::error::Personal identity remains in the history that would be published.'
            exit 1
          fi

          # git-filter-repo removes origin intentionally as a safety measure.
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease=refs/heads/main:"$GITHUB_SHA" origin refs/heads/main:refs/heads/main
          git push --force origin --tags
