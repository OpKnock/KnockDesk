name: Unpack KnockDesk ASAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Extract packaged app for inspection
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository and fetch LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify archive is not an LFS pointer
        shell: pwsh
        run: |
          $archive = "resources/app.asar"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "resources/app.asar is missing; verify Git LFS access."
          }
          $stream = [System.IO.File]::OpenRead($archive)
          try {
            $buffer = New-Object byte[] 80
            $count = $stream.Read($buffer, 0, $buffer.Length)
          } finally {
            $stream.Dispose()
          }
          $prefix = [System.Text.Encoding]::UTF8.GetString($buffer, 0, $count)
          if ($prefix.StartsWith("version https://git-lfs.github.com/spec/v1")) {
            throw "resources/app.asar is still a Git LFS pointer."
          }
          Write-Host ("Archive payload present: {0:N0} bytes" -f (Get-Item $archive).Length)

      - name: List and extract original ASAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          npx --yes asar list resources/app.asar | Out-File -Encoding utf8 staging/asar-file-list.txt
          if ($LASTEXITCODE -ne 0) { throw "ASAR listing failed." }
          npx --yes asar extract resources/app.asar staging/app.asar.extracted
          if ($LASTEXITCODE -ne 0) { throw "ASAR extraction failed." }
          @(
            "# KnockDesk ASAR extraction",
            "",
            "Generated inspection copy of resources/app.asar.",
            "Minified bundles remain minified; this process does not reconstruct missing source or V8 bytecode.",
            "The original archive was not modified."
          ) | Set-Content -Encoding utf8 staging/app.asar.extracted/EXTRACTION-README.md

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: KnockDesk-ASAR-extracted-${{ github.sha }}
          path: |
            staging/app.asar.extracted/
            staging/asar-file-list.txt
          if-no-files-found: error
          retention-days: 7
