name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.12)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  nsis:
    name: Build NSIS offline installer
    runs-on: windows-latest
    timeout-minutes: 120
    # Secrets are not available in step-level `if:` expressions; expose them
    # through the job environment so the signing steps can test for them.
    env:
      WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Checkout (full, with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify LFS payloads fetched
        shell: pwsh
        run: |
          $exe = 'KnockDesk.exe'
          $bytes = (Get-Item $exe -ErrorAction Stop).Length
          if ($bytes -lt 100MB) { throw "KnockDesk.exe is $bytes bytes - LFS payload not fetched" }
          Write-Output "KnockDesk.exe: $([math]::Round($bytes/1MB,1)) MB"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw 'makensis not found after choco install' }
          & $makensis -VERSION

      - name: Install Python PIL for icon generation
        shell: pwsh
        run: python -m pip install Pillow --quiet

      - name: Rebuild git-ignored payloads (node_modules, dists, venvs)
        shell: pwsh
        run: |
          # The agent runtimes are git-ignored build-host trees. This step
          # rebuilds them from committed sources so a checkout-only runner can
          # stage a complete installer. Pins come from requirements-windows-*.txt
          # (frozen from the shipped venvs); the interpreter is the committed
          # resources/hermes-runtime/python tree.
          $ErrorActionPreference = 'Stop'
          $py = 'resources\hermes-runtime\python\python.exe'
          if (-not (Test-Path $py)) { throw "embedded python missing: $py" }

          # 1. Regenerate the archive-adjacent extracted trees (*.extracted is
          #    git-ignored because it is expandable from the archive beside it).
          $zip = 'resources\python-embedded\python311.zip'
          if ((Test-Path $zip) -and -not (Test-Path "$zip.extracted")) {
            Expand-Archive -Path $zip -DestinationPath "$zip.extracted" -Force
            Write-Output 'regenerated python311.zip.extracted'
          }

          # 2. node_modules + dashboard/tui bundles for the hermes runtime.
          Push-Location 'resources\hermes-runtime\src'
          try {
            npm install --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            npm run build --workspace web
            if ($LASTEXITCODE -ne 0) { throw 'web build failed' }
            npm run build --workspace ui-tui
            if ($LASTEXITCODE -ne 0) { throw 'ui-tui build failed' }
            New-Item -ItemType Directory -Path 'hermes_cli\tui_dist' -Force | Out-Null
            Copy-Item 'ui-tui\dist\entry.js' 'hermes_cli\tui_dist\entry.js' -Force
            Write-Output 'node_modules + dists rebuilt'
          } finally { Pop-Location }

          # 3. The two venvs (uv, same interpreter + frozen pins).
          python -m pip install uv --quiet --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'uv install failed' }
          foreach ($pair in @(
            @{ venv = 'resources\hermes-runtime\venv'; req = 'scripts\requirements-windows-hermes.txt'; editable = 'resources\hermes-runtime\src' },
            @{ venv = 'resources\computer-runtime\venv'; req = 'scripts\requirements-windows-computer.txt'; editable = $null }
          )) {
            if (Test-Path $pair.venv) { Remove-Item $pair.venv -Recurse -Force }
            uv venv --python $py $pair.venv
            if ($LASTEXITCODE -ne 0) { throw "uv venv failed: $($pair.venv)" }
            # --no-deps: the freeze is the complete closure (frozen from the
            # shipped venvs); resolving dependencies again would pull extras
            # the shipped venvs deliberately do not have (gui-agents' OCR/CV
            # stack, ~76 packages).
            uv pip install --no-deps --python "$($pair.venv)\Scripts\python.exe" -r $pair.req
            if ($LASTEXITCODE -ne 0) { throw "uv pip install failed: $($pair.req)" }
            if ($pair.editable) {
              uv pip install --python "$($pair.venv)\Scripts\python.exe" -e $pair.editable
              if ($LASTEXITCODE -ne 0) { throw "uv editable install failed: $($pair.editable)" }
            }
            $n = (Get-ChildItem "$($pair.venv)\Lib\site-packages" -Filter '*.dist-info').Count
            Write-Output "$($pair.venv): $n packages installed"
          }

      - name: Build installer
        shell: pwsh
        run: |
          # Stages the payload (the rebuild step above must have run first);
          # build-nsis-installer.ps1 verifies the runtime payloads after
          # staging, then compiles.
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = '${{ github.ref_name }}' }
          if (-not $version -or $version -eq 'refs/heads/main') { $version = '3.1.12' }
          $version = $version -replace '^v', ''
          Write-Output "Building KnockDesk-Setup-$version-x64.exe"
          powershell -ExecutionPolicy Bypass -File scripts/build-nsis-installer.ps1 -Version $version

      - name: Verify installer exists and is non-trivial
        shell: pwsh
        run: |
          $out = Get-ChildItem dist\KnockDesk-Setup-*.exe | Select-Object -First 1
          if (-not $out) { throw 'No installer found in dist/' }
          $mb = [math]::Round($out.Length / 1MB, 0)
          if ($mb -lt 500) { throw "Installer is only ${mb} MB — expected >500 MB (LFS payload missing?)" }
          Write-Output "Installer: $($out.Name), ${mb} MB"
          $hash = (Get-FileHash $out.FullName -Algorithm SHA256).Hash
          Write-Output "SHA-256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: knockdesk-windows-installer
          path: |
            dist/KnockDesk-Setup-*.exe
            dist/SHA256SUMS*.txt
          retention-days: 30
          compression-level: 0  # installer is already LZMA-compressed

      # Signing is a SEPARATE gated job. The unsigned installer is the
      # release candidate; the signed one is the release artifact.
      # Secrets are NEVER embedded in the build.
      #
      # Two mutually exclusive paths (docs/ops/signing.md):
      #   SignPath OSS (free for open source) — secrets: SIGNPATH_API_TOKEN +
      #     SIGNPATH_ORGANIZATION_ID; SignPath holds the certificate.
      #   Bring-your-own certificate      — secrets: WINDOWS_CERT_PFX_B64 +
      #     WINDOWS_CERT_PASSWORD; signed locally with signtool.
      - name: 'Sign installer (SignPath OSS, free for open source)'
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.WINDOWS_CERT_PFX_B64 == '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        uses: signpath/github-action-sign@v1
        with:
          api-key: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: knockdesk
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          input-artifact-paths: dist/KnockDesk-Setup-*.exe
          wait-for-completion: true

      - name: 'Sign installer (gated: requires cert secrets)'
        if: ${{ env.WINDOWS_CERT_PFX_B64 != '' && env.WINDOWS_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $out = Get-ChildItem dist\KnockDesk-Setup-*.exe | Select-Object -First 1
          $exe = Get-Item 'KnockDesk.exe'
          powershell -ExecutionPolicy Bypass -File scripts/sign-release.ps1 -InstallerPath $out.FullName -ExePath $exe.FullName

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KnockDesk-Setup-*.exe
            dist/SHA256SUMS*.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
